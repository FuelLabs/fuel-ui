server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Hashed Vite chunks of the Storybook preview never change: cache for a year.
    # Storybook writes hashed bundles (name-<hash>.ext) and copies the unhashed
    # files from public/assets/ (eth.svg) into the same directory. Only the
    # hashed names are safe to cache as immutable.
    # The regex is quoted: nginx reads an unquoted { } as a block delimiter.
    location ~* "^/assets/[^/]+-[0-9a-f]{8,}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Static Storybook build: no SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
